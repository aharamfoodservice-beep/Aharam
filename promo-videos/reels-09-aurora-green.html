<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aharam — Aurora Green</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1920px;overflow:hidden;background:#0A1A0A;font-family:'Inter',sans-serif;position:relative}
  /* Aurora gradient background */
  .aurora{position:absolute;inset:0;background:linear-gradient(180deg,#0A1A0A 0%,#0D2818 30%,#1B4332 50%,#0D2818 70%,#0A1A0A 100%);opacity:.8}
  .orb{position:absolute;border-radius:50%;filter:blur(150px)}
  .orb.a1{width:800px;height:800px;background:#00C853;top:-300px;left:-200px;opacity:.1;animation:au 10s infinite ease-in-out}
  .orb.a2{width:600px;height:600px;background:#76FF03;top:20%;right:-300px;opacity:.06;animation:au 12s 3s infinite ease-in-out}
  .orb.a3{width:500px;height:500px;background:#00E676;bottom:-150px;left:30%;opacity:.08;animation:au 8s 5s infinite ease-in-out}
  @keyframes au{0%,100%{transform:translateX(0) scale(1)}25%{transform:translateX(80px) scale(1.1)}50%{transform:translateX(-60px) scale(1.2)}75%{transform:translateX(40px) scale(1.05)}}
  /* Firefly particles */
  .fireflies{position:absolute;inset:0;overflow:hidden}
  .ff{position:absolute;width:6px;height:6px;background:radial-gradient(circle,#76FF03,transparent);border-radius:50%;animation:fly 8s infinite ease-in-out;opacity:0}
  .ff:nth-child(1){top:10%;left:15%;animation-delay:0s}.ff:nth-child(2){top:25%;left:75%;animation-delay:1.5s;width:4px;height:4px}
  .ff:nth-child(3){top:40%;left:30%;animation-delay:3s;width:8px;height:8px}.ff:nth-child(4){top:55%;left:85%;animation-delay:.5s}
  .ff:nth-child(5){top:70%;left:45%;animation-delay:2.5s;width:5px;height:5px}.ff:nth-child(6){top:85%;left:20%;animation-delay:4s}
  .ff:nth-child(7){top:35%;left:60%;animation-delay:5s;width:7px;height:7px}.ff:nth-child(8){top:65%;left:10%;animation-delay:1s}
  @keyframes fly{0%,100%{opacity:0;transform:translate(0,0)}10%{opacity:.8}30%{transform:translate(30px,-20px);opacity:.6}50%{opacity:.9;transform:translate(-20px,-40px)}70%{transform:translate(15px,-10px);opacity:.5}90%{opacity:.2}}
  .content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:100px 60px}
  .nature-badge{display:flex;align-items:center;gap:12px;background:rgba(0,200,83,.06);backdrop-filter:blur(20px);border:1.5px solid rgba(0,200,83,.18);border-radius:60px;padding:14px 36px;opacity:0;animation:sd 1s .3s ease forwards}
  .nature-badge .text{font-size:15px;font-weight:800;color:#69F0AE;letter-spacing:4px;text-transform:uppercase}
  @keyframes sd{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:translateY(0)}}
  .brand{font-family:'Playfair Display',serif;font-size:140px;font-weight:900;background:linear-gradient(135deg,#B9F6CA,#00C853,#69F0AE);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:50px;opacity:0;animation:br 1.5s .8s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes br{from{opacity:0;transform:translateY(60px) scale(.85)}to{opacity:1;transform:translateY(0) scale(1)}}
  .tagline{font-size:17px;font-weight:600;color:rgba(105,240,174,.3);letter-spacing:10px;text-transform:uppercase;margin-top:12px;opacity:0;animation:fu 1s 1.8s ease forwards}
  @keyframes fu{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
  /* Farm to table journey */
  .journey{display:flex;align-items:center;gap:0;margin-top:70px;width:100%;max-width:800px;justify-content:center}
  .j-step{display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0}
  .j-step:nth-child(1){animation:js .6s 2.2s ease forwards}.j-step:nth-child(3){animation:js .6s 2.8s ease forwards}
  .j-step:nth-child(5){animation:js .6s 3.4s ease forwards}.j-step:nth-child(7){animation:js .6s 4s ease forwards}
  @keyframes js{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
  .j-step .emoji{font-size:56px}
  .j-step .label{font-size:14px;font-weight:700;color:#69F0AE;letter-spacing:1px}
  .j-arrow{font-size:30px;color:rgba(105,240,174,.2);opacity:0;margin:0 16px}
  .j-arrow:nth-child(2){animation:ar .5s 2.5s ease forwards}.j-arrow:nth-child(4){animation:ar .5s 3.1s ease forwards}
  .j-arrow:nth-child(6){animation:ar .5s 3.7s ease forwards}
  @keyframes ar{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
  .headline{font-family:'Playfair Display',serif;font-size:68px;font-weight:700;color:#fff;text-align:center;line-height:1.15;margin-top:80px;opacity:0;animation:fu 1.2s 4.2s ease forwards}
  .headline .green{background:linear-gradient(135deg,#69F0AE,#00C853);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .desc{font-size:22px;color:rgba(105,240,174,.3);text-align:center;margin-top:25px;line-height:1.5;opacity:0;animation:fu 1s 4.7s ease forwards}
  .cta{margin-top:50px;padding:24px 70px;background:linear-gradient(135deg,#00C853,#00E676);color:#0A1A0A;font-size:19px;font-weight:800;letter-spacing:3px;text-transform:uppercase;border-radius:60px;box-shadow:0 16px 50px rgba(0,200,83,.25);opacity:0;animation:cp 1s 5.2s cubic-bezier(.16,1,.3,1) forwards;position:relative;overflow:hidden}
  .cta::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,.15) 50%,transparent 60%);animation:sh 3s 6s infinite}
  @keyframes sh{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  @keyframes cp{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
  .bottom{position:absolute;bottom:80px;left:0;right:0;text-align:center;z-index:10;opacity:0;animation:fu .8s 5.8s ease forwards}
  .bottom .b-brand{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:rgba(105,240,174,.2);letter-spacing:6px}
  .bottom .b-sub{font-size:11px;color:rgba(105,240,174,.1);margin-top:6px;letter-spacing:4px;text-transform:uppercase}
</style>
</head>
<body>
  <div class="aurora"></div>
  <div class="orb a1"></div><div class="orb a2"></div><div class="orb a3"></div>
  <div class="fireflies"><div class="ff"></div><div class="ff"></div><div class="ff"></div><div class="ff"></div><div class="ff"></div><div class="ff"></div><div class="ff"></div><div class="ff"></div></div>
  <div class="content">
    <div class="nature-badge"><span style="font-size:24px">🌱</span><span class="text">Farm to Table</span></div>
    <div class="brand">Aharam</div>
    <div class="tagline">Nature's Freshest</div>
    <div class="journey">
      <div class="j-step"><div class="emoji">🌾</div><div class="label">Farm</div></div>
      <div class="j-arrow">→</div>
      <div class="j-step"><div class="emoji">🧑‍🍳</div><div class="label">Kitchen</div></div>
      <div class="j-arrow">→</div>
      <div class="j-step"><div class="emoji">📦</div><div class="label">Packed</div></div>
      <div class="j-arrow">→</div>
      <div class="j-step"><div class="emoji">🏠</div><div class="label">Your Door</div></div>
    </div>
    <div class="headline">From Farm,<br><span class="green">To Your Plate.</span></div>
    <div class="desc">Zero middlemen. Maximum freshness.<br>Every ingredient traceable, every meal pure.</div>
    <div class="cta">Experience Freshness</div>
  </div>
  <div class="bottom"><div class="b-brand">AHARAM</div><div class="b-sub">Nature's Kitchen, Delivered</div></div>
</body>
</html>
