<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aharam — Electric Cyan</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1920px;overflow:hidden;background:#020E1A;font-family:'Inter',sans-serif;position:relative}
  .orb{position:absolute;border-radius:50%;filter:blur(140px)}
  .orb.c1{width:700px;height:700px;background:#00838F;top:-200px;right:-150px;opacity:.3;animation:gp 7s infinite ease-in-out}
  .orb.c2{width:550px;height:550px;background:#00BCD4;bottom:250px;left:-200px;opacity:.18;animation:gp 9s 3s infinite ease-in-out}
  .orb.c3{width:400px;height:400px;background:#4DD0E1;bottom:-80px;left:40%;opacity:.12;animation:gp 6s 5s infinite ease-in-out}
  @keyframes gp{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
  /* Speed lines */
  .speed-lines{position:absolute;inset:0;overflow:hidden}
  .sl{position:absolute;height:2px;background:linear-gradient(90deg,transparent,#00BCD4,transparent);opacity:0;animation:speed 4s infinite ease}
  .sl:nth-child(1){top:10%;left:0;width:400px;animation-delay:0s}
  .sl:nth-child(2){top:25%;left:20%;width:300px;animation-delay:1.5s}
  .sl:nth-child(3){top:40%;left:5%;width:500px;animation-delay:.8s}
  .sl:nth-child(4){top:55%;left:30%;width:250px;animation-delay:2.5s}
  .sl:nth-child(5){top:70%;left:10%;width:350px;animation-delay:1s}
  .sl:nth-child(6){top:85%;left:25%;width:450px;animation-delay:3s}
  @keyframes speed{0%{transform:translateX(-100%);opacity:0}30%{opacity:.3}70%{opacity:.3}100%{transform:translateX(200%);opacity:0}}
  .content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:100px 60px}
  .speed-badge{display:flex;align-items:center;gap:12px;background:rgba(0,188,212,.08);backdrop-filter:blur(20px);border:1.5px solid rgba(0,188,212,.2);border-radius:60px;padding:14px 36px;opacity:0;animation:sd 1s .3s cubic-bezier(.16,1,.3,1) forwards}
  .speed-badge .icon{font-size:28px}
  .speed-badge .text{font-size:15px;font-weight:800;color:#4DD0E1;letter-spacing:4px;text-transform:uppercase}
  @keyframes sd{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:translateY(0)}}
  .brand{font-family:'Playfair Display',serif;font-size:140px;font-weight:900;background:linear-gradient(135deg,#B2EBF2,#00BCD4,#4DD0E1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:50px;opacity:0;animation:br 1.5s .8s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes br{from{opacity:0;transform:translateY(60px) scale(.85)}to{opacity:1;transform:translateY(0) scale(1)}}
  .tagline{font-size:17px;font-weight:600;color:rgba(77,208,225,.4);letter-spacing:10px;text-transform:uppercase;margin-top:12px;opacity:0;animation:fu 1s 1.8s ease forwards}
  @keyframes fu{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
  /* Clock visualization */
  .clock-ring{width:320px;height:320px;border-radius:50%;border:3px solid rgba(0,188,212,.15);margin-top:60px;position:relative;display:flex;align-items:center;justify-content:center;opacity:0;animation:ci 1s 2.2s ease forwards}
  @keyframes ci{from{opacity:0;transform:scale(.6) rotate(-90deg)}to{opacity:1;transform:scale(1) rotate(0)}}
  .clock-ring::before{content:'';position:absolute;inset:15px;border-radius:50%;border:2px solid rgba(0,188,212,.08)}
  .clock-ring::after{content:'';position:absolute;inset:30px;border-radius:50%;border:1px solid rgba(0,188,212,.05)}
  .clock-center{font-size:80px;animation:pulse 3s infinite ease-in-out}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  .clock-marks{position:absolute;inset:0}
  .cm{position:absolute;width:3px;height:16px;background:#00BCD4;left:50%;top:8px;transform-origin:50% calc(160px - 8px);opacity:.3}
  .cm:nth-child(1){transform:rotate(0deg)}.cm:nth-child(2){transform:rotate(30deg)}.cm:nth-child(3){transform:rotate(60deg)}
  .cm:nth-child(4){transform:rotate(90deg)}.cm:nth-child(5){transform:rotate(120deg)}.cm:nth-child(6){transform:rotate(150deg)}
  .cm:nth-child(7){transform:rotate(180deg)}.cm:nth-child(8){transform:rotate(210deg)}.cm:nth-child(9){transform:rotate(240deg)}
  .cm:nth-child(10){transform:rotate(270deg)}.cm:nth-child(11){transform:rotate(300deg)}.cm:nth-child(12){transform:rotate(330deg)}
  .stats{display:flex;gap:30px;margin-top:50px;opacity:0;animation:fu 1s 2.8s ease forwards}
  .stat{background:rgba(0,188,212,.06);backdrop-filter:blur(15px);border:1px solid rgba(0,188,212,.15);border-radius:20px;padding:24px 32px;text-align:center;flex:1}
  .stat .num{font-size:36px;font-weight:900;color:#4DD0E1}
  .stat .label{font-size:13px;color:rgba(77,208,225,.4);margin-top:6px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
  .headline{font-family:'Playfair Display',serif;font-size:68px;font-weight:700;color:#fff;text-align:center;line-height:1.15;margin-top:60px;opacity:0;animation:fu 1.2s 3.5s ease forwards}
  .headline .cyan{background:linear-gradient(135deg,#4DD0E1,#00BCD4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .cta{margin-top:50px;padding:24px 70px;background:linear-gradient(135deg,#00838F,#00BCD4);color:#fff;font-size:19px;font-weight:800;letter-spacing:3px;text-transform:uppercase;border-radius:60px;box-shadow:0 16px 50px rgba(0,188,212,.3);opacity:0;animation:cp 1s 4.2s cubic-bezier(.16,1,.3,1) forwards;position:relative;overflow:hidden}
  .cta::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,.1) 50%,transparent 60%);animation:sh 3s 5s infinite}
  @keyframes sh{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  @keyframes cp{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
  .bottom{position:absolute;bottom:80px;left:0;right:0;text-align:center;z-index:10;opacity:0;animation:fu .8s 5s ease forwards}
  .bottom .b-brand{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:rgba(77,208,225,.3)}
  .bottom .b-sub{font-size:12px;color:rgba(77,208,225,.18);margin-top:6px;letter-spacing:3px;text-transform:uppercase}
</style>
</head>
<body>
  <div class="orb c1"></div><div class="orb c2"></div><div class="orb c3"></div>
  <div class="speed-lines"><div class="sl"></div><div class="sl"></div><div class="sl"></div><div class="sl"></div><div class="sl"></div><div class="sl"></div></div>
  <div class="content">
    <div class="speed-badge"><span class="icon">⚡</span><span class="text">Lightning Fast</span></div>
    <div class="brand">Aharam</div>
    <div class="tagline">Never Late • Never Cold</div>
    <div class="clock-ring">
      <div class="clock-marks"><div class="cm"></div><div class="cm"></div><div class="cm"></div><div class="cm"></div><div class="cm"></div><div class="cm"></div><div class="cm"></div><div class="cm"></div><div class="cm"></div><div class="cm"></div><div class="cm"></div><div class="cm"></div></div>
      <div class="clock-center">⏰</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="num">98.5%</div><div class="label">On-Time Rate</div></div>
      <div class="stat"><div class="num">30min</div><div class="label">Avg Delivery</div></div>
      <div class="stat"><div class="num">500+</div><div class="label">Happy Users</div></div>
    </div>
    <div class="headline">On-Time,<br><span class="cyan">Every Time.</span></div>
    <div class="cta">Order Now</div>
  </div>
  <div class="bottom"><div class="b-brand">Aharam</div><div class="b-sub">Punctuality is Our Promise</div></div>
</body>
</html>
