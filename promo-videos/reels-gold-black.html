<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aharam — Gold & Black Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px; overflow: hidden;
    background: #000000; font-family: 'Inter', sans-serif;
    position: relative;
  }

  /* Gold ambient glows */
  .bg-glow {
    position: absolute; border-radius: 50%; filter: blur(160px);
  }
  .bg-glow.g1 { width: 600px; height: 600px; background: #D4AF37; top: -150px; right: -100px; opacity: 0.08; animation: glowPulse 6s infinite ease-in-out; }
  .bg-glow.g2 { width: 500px; height: 500px; background: #B8860B; bottom: 200px; left: -150px; opacity: 0.06; animation: glowPulse 8s 2s infinite ease-in-out; }
  .bg-glow.g3 { width: 400px; height: 400px; background: #D4AF37; bottom: -100px; right: -50px; opacity: 0.05; animation: glowPulse 7s 1s infinite ease-in-out; }

  @keyframes glowPulse { 0%, 100% { opacity: 0.06; } 50% { opacity: 0.12; } }

  /* Gold particle system */
  .particles { position: absolute; inset: 0; overflow: hidden; }
  .particle {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, #D4AF37 0%, transparent 70%);
    animation: sparkle 5s infinite ease-in-out;
  }
  .particle:nth-child(1) { width: 6px; height: 6px; top: 8%; left: 15%; animation-delay: 0s; }
  .particle:nth-child(2) { width: 4px; height: 4px; top: 22%; left: 78%; animation-delay: 1.2s; }
  .particle:nth-child(3) { width: 5px; height: 5px; top: 35%; left: 45%; animation-delay: 0.6s; }
  .particle:nth-child(4) { width: 3px; height: 3px; top: 52%; left: 88%; animation-delay: 2s; }
  .particle:nth-child(5) { width: 7px; height: 7px; top: 65%; left: 25%; animation-delay: 1.5s; }
  .particle:nth-child(6) { width: 4px; height: 4px; top: 78%; left: 62%; animation-delay: 0.3s; }
  .particle:nth-child(7) { width: 5px; height: 5px; top: 88%; left: 40%; animation-delay: 2.5s; }
  .particle:nth-child(8) { width: 3px; height: 3px; top: 45%; left: 10%; animation-delay: 1.8s; }

  @keyframes sparkle {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.8); }
  }

  /* Decorative gold lines */
  .gold-line {
    position: absolute; left: 50%; transform: translateX(-50%);
    height: 2px; background: linear-gradient(90deg, transparent, #D4AF37, transparent);
    opacity: 0;
  }
  .gold-line.top { top: 120px; width: 400px; animation: lineIn 1s 0.5s ease forwards; }
  .gold-line.mid { top: 960px; width: 300px; animation: lineIn 1s 3s ease forwards; }
  .gold-line.bottom { bottom: 280px; width: 350px; animation: lineIn 1s 5s ease forwards; }

  @keyframes lineIn { to { opacity: 0.5; } }

  /* Content layout */
  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 10; padding: 100px 60px;
  }

  /* Top crown accent */
  .crown-accent {
    font-size: 60px;
    opacity: 0; animation: fadeDown 1s 0.3s ease forwards;
    margin-bottom: 30px;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Brand name */
  .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 130px; font-weight: 900;
    color: #D4AF37;
    text-shadow: 0 0 80px rgba(212,175,55,0.3);
    letter-spacing: 12px;
    opacity: 0; animation: brandIn 1.4s 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes brandIn {
    from { opacity: 0; transform: translateY(50px) scale(0.9); letter-spacing: 30px; }
    to { opacity: 1; transform: translateY(0) scale(1); letter-spacing: 12px; }
  }

  /* Subtitle */
  .subtitle {
    font-size: 18px; font-weight: 600;
    color: rgba(212,175,55,0.6);
    letter-spacing: 8px; text-transform: uppercase;
    margin-top: 20px;
    opacity: 0; animation: fadeUp 1s 1.8s ease forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Divider ornament */
  .divider {
    display: flex; align-items: center; gap: 16px;
    margin-top: 80px; margin-bottom: 80px;
    opacity: 0; animation: fadeUp 1s 2.5s ease forwards;
  }
  .divider-line {
    width: 100px; height: 1px;
    background: linear-gradient(90deg, transparent, #D4AF37);
  }
  .divider-line.right { background: linear-gradient(270deg, transparent, #D4AF37); }
  .divider-diamond {
    width: 10px; height: 10px;
    border: 1.5px solid #D4AF37;
    transform: rotate(45deg);
  }

  /* Headline */
  .headline {
    font-family: 'Playfair Display', serif;
    font-size: 68px; font-weight: 700;
    color: #ffffff; text-align: center;
    line-height: 1.2;
    opacity: 0; animation: fadeUp 1.2s 3s ease forwards;
  }
  .headline .gold { color: #D4AF37; }

  /* Description */
  .description {
    font-size: 22px; font-weight: 400;
    color: rgba(255,255,255,0.45);
    text-align: center; line-height: 1.6;
    margin-top: 40px; max-width: 750px;
    opacity: 0; animation: fadeUp 1s 3.8s ease forwards;
  }

  /* CTA */
  .cta {
    margin-top: 80px;
    padding: 22px 60px;
    background: transparent;
    border: 2px solid #D4AF37;
    color: #D4AF37;
    font-size: 18px; font-weight: 700;
    letter-spacing: 4px; text-transform: uppercase;
    border-radius: 0;
    opacity: 0; animation: ctaIn 1s 4.5s ease forwards;
    position: relative;
    overflow: hidden;
  }
  .cta::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(212,175,55,0.1), transparent);
  }

  @keyframes ctaIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  /* Bottom trust strip */
  .bottom-strip {
    position: absolute; bottom: 80px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 50px;
    z-index: 10;
    opacity: 0; animation: fadeUp 0.8s 5.2s ease forwards;
  }
  .trust-item {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .trust-icon {
    width: 52px; height: 52px; border-radius: 50%;
    border: 1px solid rgba(212,175,55,0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .trust-label {
    font-size: 12px; color: rgba(212,175,55,0.5);
    font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="bg-glow g1"></div>
  <div class="bg-glow g2"></div>
  <div class="bg-glow g3"></div>

  <div class="particles">
    <div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div>
  </div>

  <div class="gold-line top"></div>
  <div class="gold-line mid"></div>
  <div class="gold-line bottom"></div>

  <div class="content">
    <div class="crown-accent">👑</div>
    <div class="brand-name">Aharam</div>
    <div class="subtitle">Premium Food Service</div>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-diamond"></div>
      <div class="divider-line right"></div>
    </div>

    <div class="headline">
      Redefining<br>
      <span class="gold">Daily Dining.</span>
    </div>

    <div class="description">
      Handcrafted meals prepared by expert chefs,<br>delivered fresh to your doorstep every day.
    </div>

    <div class="cta">Discover Aharam</div>
  </div>

  <div class="bottom-strip">
    <div class="trust-item">
      <div class="trust-icon">🍽️</div>
      <div class="trust-label">200+ Daily</div>
    </div>
    <div class="trust-item">
      <div class="trust-icon">🛡️</div>
      <div class="trust-label">FSSAI Certified</div>
    </div>
    <div class="trust-item">
      <div class="trust-icon">⚡</div>
      <div class="trust-label">On-Time</div>
    </div>
    <div class="trust-item">
      <div class="trust-icon">📱</div>
      <div class="trust-label">WhatsApp</div>
    </div>
  </div>
</body>
</html>
