<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aharam — Midnight Emerald</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1920px;overflow:hidden;background:#021A0F;font-family:'Inter',sans-serif;position:relative}
  .orb{position:absolute;border-radius:50%;filter:blur(120px)}
  .orb.o1{width:700px;height:700px;background:#064E3B;top:-200px;right:-200px;opacity:.35;animation:op 8s infinite ease-in-out}
  .orb.o2{width:500px;height:500px;background:#059669;bottom:300px;left:-200px;opacity:.2;animation:op 8s 3s infinite ease-in-out}
  .orb.o3{width:600px;height:600px;background:#10B981;bottom:-100px;right:-100px;opacity:.15;animation:op 8s 5s infinite ease-in-out}
  @keyframes op{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
  .particles{position:absolute;inset:0;overflow:hidden}
  .p{position:absolute;border-radius:50%;background:radial-gradient(circle,#34D399,transparent 70%);animation:fl 12s infinite ease-in-out}
  .p:nth-child(1){width:8px;height:8px;top:5%;left:20%;animation-delay:0s}
  .p:nth-child(2){width:5px;height:5px;top:15%;left:75%;animation-delay:2s}
  .p:nth-child(3){width:6px;height:6px;top:30%;left:40%;animation-delay:1s}
  .p:nth-child(4){width:4px;height:4px;top:50%;left:85%;animation-delay:4s}
  .p:nth-child(5){width:7px;height:7px;top:65%;left:15%;animation-delay:3s}
  .p:nth-child(6){width:5px;height:5px;top:80%;left:60%;animation-delay:5s}
  .p:nth-child(7){width:6px;height:6px;top:45%;left:50%;animation-delay:1.5s}
  .p:nth-child(8){width:9px;height:9px;top:25%;left:10%;animation-delay:2.5s}
  @keyframes fl{0%,100%{transform:translateY(0) scale(1);opacity:.3}25%{transform:translateY(-40px) translateX(20px) scale(1.3);opacity:.8}50%{transform:translateY(-10px) translateX(-15px);opacity:.5}75%{transform:translateY(-60px) translateX(10px) scale(1.5);opacity:.9}}
  .grid-deco{position:absolute;inset:0;background-image:linear-gradient(rgba(16,185,129,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(16,185,129,.03) 1px,transparent 1px);background-size:80px 80px}
  .content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:100px 60px}
  .top-badge{display:flex;align-items:center;gap:14px;background:rgba(16,185,129,.08);backdrop-filter:blur(20px);border:1.5px solid rgba(16,185,129,.2);border-radius:60px;padding:14px 36px;opacity:0;animation:sd 1s .3s cubic-bezier(.16,1,.3,1) forwards}
  .top-badge .icon{font-size:26px}
  .top-badge .text{font-size:15px;font-weight:800;color:#34D399;letter-spacing:4px;text-transform:uppercase}
  @keyframes sd{from{opacity:0;transform:translateY(-40px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
  .brand{font-family:'Playfair Display',serif;font-size:140px;font-weight:900;background:linear-gradient(135deg,#6EE7B7,#059669,#34D399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:50px;opacity:0;animation:br 1.5s .8s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes br{from{opacity:0;transform:translateY(60px) scale(.85);letter-spacing:30px}to{opacity:1;transform:translateY(0) scale(1);letter-spacing:8px}}
  .subtitle{font-size:17px;font-weight:600;color:rgba(52,211,153,.45);letter-spacing:10px;text-transform:uppercase;margin-top:12px;opacity:0;animation:fu 1s 1.8s ease forwards}
  @keyframes fu{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
  .divider{display:flex;align-items:center;gap:20px;margin:60px 0;opacity:0;animation:fu 1s 2.2s ease forwards}
  .div-line{width:120px;height:1px;background:linear-gradient(90deg,transparent,#10B981,transparent)}
  .div-diamond{width:12px;height:12px;border:2px solid #10B981;transform:rotate(45deg)}
  .features{display:flex;flex-direction:column;gap:18px;width:100%;max-width:800px}
  .fc{background:rgba(16,185,129,.05);backdrop-filter:blur(20px);border:1px solid rgba(16,185,129,.12);border-radius:24px;padding:30px 36px;display:flex;align-items:center;gap:24px;opacity:0;transform:translateX(-60px)}
  .fc:nth-child(1){animation:cs .8s 2.5s cubic-bezier(.16,1,.3,1) forwards}
  .fc:nth-child(2){animation:cs .8s 2.8s cubic-bezier(.16,1,.3,1) forwards}
  .fc:nth-child(3){animation:cs .8s 3.1s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes cs{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:translateX(0)}}
  .fc .fi{width:72px;height:72px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0}
  .fc .ft{font-size:22px;font-weight:800;color:#6EE7B7}
  .fc .fd{font-size:15px;color:rgba(110,231,183,.4);margin-top:4px}
  .headline{font-family:'Playfair Display',serif;font-size:72px;font-weight:700;color:#fff;text-align:center;line-height:1.15;margin-top:60px;opacity:0;animation:fu 1.2s 3.6s ease forwards}
  .headline .accent{background:linear-gradient(135deg,#34D399,#059669);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .cta{margin-top:50px;padding:24px 70px;background:linear-gradient(135deg,#059669,#10B981);color:#fff;font-size:19px;font-weight:800;letter-spacing:3px;text-transform:uppercase;border-radius:60px;box-shadow:0 16px 50px rgba(5,150,105,.35);opacity:0;animation:cp 1s 4.2s cubic-bezier(.16,1,.3,1) forwards;position:relative;overflow:hidden}
  .cta::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,.1) 50%,transparent 60%);animation:sh 3s 5s infinite}
  @keyframes sh{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  @keyframes cp{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
  .bottom-strip{position:absolute;bottom:80px;left:0;right:0;display:flex;justify-content:center;gap:50px;z-index:10;opacity:0;animation:fu .8s 5s ease forwards}
  .ti{display:flex;flex-direction:column;align-items:center;gap:10px}
  .ti-icon{width:56px;height:56px;border-radius:16px;background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.15);display:flex;align-items:center;justify-content:center;font-size:24px}
  .ti-label{font-size:11px;color:rgba(52,211,153,.4);font-weight:700;letter-spacing:2px;text-transform:uppercase}
</style>
</head>
<body>
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="particles"><div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div></div>
  <div class="grid-deco"></div>
  <div class="content">
    <div class="top-badge"><span class="icon">🛡️</span><span class="text">100% Hygienic</span></div>
    <div class="brand">Aharam</div>
    <div class="subtitle">Pure • Fresh • Clean</div>
    <div class="divider"><div class="div-line"></div><div class="div-diamond"></div><div class="div-line"></div></div>
    <div class="features">
      <div class="fc"><div class="fi">🧼</div><div><div class="ft">FSSAI Certified Kitchen</div><div class="fd">Government-approved food safety</div></div></div>
      <div class="fc"><div class="fi">🧤</div><div><div class="ft">Sanitized Packaging</div><div class="fd">Sealed fresh, delivered safe</div></div></div>
      <div class="fc"><div class="fi">✨</div><div><div class="ft">Daily Kitchen Audits</div><div class="fd">Strict quality checks every meal</div></div></div>
    </div>
    <div class="headline">Hygiene You Can<br><span class="accent">Trust.</span></div>
    <div class="cta">Subscribe Now</div>
  </div>
  <div class="bottom-strip">
    <div class="ti"><div class="ti-icon">⏰</div><div class="ti-label">On-Time</div></div>
    <div class="ti"><div class="ti-icon">🍽️</div><div class="ti-label">Fresh Daily</div></div>
    <div class="ti"><div class="ti-icon">🛡️</div><div class="ti-label">FSSAI</div></div>
    <div class="ti"><div class="ti-icon">📱</div><div class="ti-label">WhatsApp</div></div>
  </div>
</body>
</html>
