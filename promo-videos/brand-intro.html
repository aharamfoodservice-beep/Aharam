<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aharam — Brand Intro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #0F172A;
    font-family: 'Inter', sans-serif;
    position: relative;
  }

  /* Ambient background glow */
  .bg-glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0;
    animation: glowIn 2s ease forwards;
  }
  .bg-glow.pink {
    width: 500px; height: 500px;
    background: #d13d71;
    top: -100px; left: -100px;
    opacity: 0;
    animation: glowIn 2s 0.5s ease forwards;
  }
  .bg-glow.blue {
    width: 600px; height: 600px;
    background: #0f9ddb;
    bottom: -150px; right: -150px;
    opacity: 0;
    animation: glowIn 2s 1s ease forwards;
  }

  @keyframes glowIn {
    to { opacity: 0.15; }
  }

  /* Particle dots */
  .particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 4px; height: 4px;
    background: rgba(255,255,255,0.3);
    border-radius: 50%;
    animation: float 8s infinite ease-in-out;
  }
  .particle:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
  .particle:nth-child(2) { top: 60%; left: 80%; animation-delay: 1s; width: 3px; height: 3px; }
  .particle:nth-child(3) { top: 30%; left: 60%; animation-delay: 2s; width: 5px; height: 5px; }
  .particle:nth-child(4) { top: 80%; left: 30%; animation-delay: 0.5s; }
  .particle:nth-child(5) { top: 15%; left: 85%; animation-delay: 1.5s; width: 3px; height: 3px; }
  .particle:nth-child(6) { top: 70%; left: 50%; animation-delay: 3s; }
  .particle:nth-child(7) { top: 45%; left: 20%; animation-delay: 2.5s; width: 6px; height: 6px; }
  .particle:nth-child(8) { top: 90%; left: 70%; animation-delay: 0.8s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
    50% { transform: translateY(-30px) scale(1.5); opacity: 0.7; }
  }

  /* Center content */
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  /* Step 1: Decorative line appears */
  .line-top {
    width: 80px;
    height: 3px;
    background: linear-gradient(90deg, #d13d71, #0f9ddb);
    border-radius: 2px;
    opacity: 0;
    transform: scaleX(0);
    animation: lineReveal 0.8s 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    margin-bottom: 40px;
  }

  @keyframes lineReveal {
    to { opacity: 1; transform: scaleX(1); }
  }

  /* Step 2: Brand name */
  .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 120px;
    font-weight: 900;
    background: linear-gradient(135deg, #d13d71 0%, #8c5fc7 40%, #0f9ddb 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0;
    transform: translateY(40px) scale(0.9);
    animation: brandReveal 1.2s 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    letter-spacing: 4px;
  }

  @keyframes brandReveal {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Step 3: Leaf decorations */
  .leaves {
    display: flex;
    gap: 0;
    margin-top: -10px;
    margin-left: 180px;
    opacity: 0;
    animation: leafReveal 0.8s 1.8s ease forwards;
  }

  @keyframes leafReveal {
    from { opacity: 0; transform: scale(0) rotate(-30deg); }
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .leaf1 { transform: rotate(-15deg); margin-right: -8px; z-index: 2; }
  .leaf2 { transform: rotate(60deg) scale(0.8); z-index: 1; }

  /* Decorative butterfly line */
  .deco-line {
    display: flex;
    align-items: center;
    width: 300px;
    margin-top: 15px;
    gap: 10px;
    opacity: 0;
    animation: fadeUp 0.8s 2.2s ease forwards;
  }

  .deco-line-bar {
    height: 2px;
    flex: 1;
    border-radius: 2px;
  }
  .deco-line-bar.left { background: linear-gradient(90deg, transparent, #d13d71); }
  .deco-line-bar.right { background: linear-gradient(270deg, transparent, #0f9ddb); }

  /* Step 4: Tagline */
  .tagline {
    font-size: 22px;
    font-weight: 500;
    color: rgba(255,255,255,0.6);
    letter-spacing: 2px;
    margin-top: 30px;
    opacity: 0;
    animation: fadeUp 1s 2.5s ease forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Step 5: Separator + headline */
  .separator {
    width: 2px;
    height: 60px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.3), transparent);
    margin-top: 40px;
    opacity: 0;
    animation: fadeUp 0.8s 3.2s ease forwards;
  }

  .headline {
    font-family: 'Playfair Display', serif;
    font-size: 52px;
    font-weight: 700;
    color: #ffffff;
    text-align: center;
    line-height: 1.2;
    margin-top: 30px;
    opacity: 0;
    animation: fadeUp 1s 3.6s ease forwards;
  }

  .headline .gradient-word {
    background: linear-gradient(135deg, #d13d71, #0f9ddb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Step 6: CTA */
  .cta {
    margin-top: 50px;
    padding: 18px 50px;
    background: linear-gradient(135deg, #d13d71, #0f9ddb);
    color: white;
    font-size: 18px;
    font-weight: 700;
    border-radius: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0;
    animation: ctaReveal 1s 4.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    box-shadow: 0 8px 30px rgba(209, 61, 113, 0.3);
  }

  @keyframes ctaReveal {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Step 7: Bottom info bar */
  .bottom-bar {
    position: absolute;
    bottom: 50px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 40px;
    opacity: 0;
    animation: fadeUp 0.8s 5s ease forwards;
  }

  .bottom-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .bottom-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .bottom-label {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    font-weight: 500;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

  <!-- Background glows -->
  <div class="bg-glow pink"></div>
  <div class="bg-glow blue"></div>

  <!-- Floating particles -->
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- Main Content -->
  <div class="content">
    <div class="line-top"></div>

    <div class="brand-name">Aharam</div>

    <div class="leaves">
      <svg class="leaf1" width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C12 2 4 6 4 14C4 18 8 22 12 22C16 22 20 18 20 14C20 6 12 2 12 2Z" fill="#d13d71"/>
      </svg>
      <svg class="leaf2" width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C12 2 4 6 4 14C4 18 8 22 12 22C16 22 20 18 20 14C20 6 12 2 12 2Z" fill="#8c7aeb"/>
      </svg>
    </div>

    <div class="deco-line">
      <div class="deco-line-bar left"></div>
      <svg width="22" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 12C6 4 2 8 8 16C9 18 11.5 20 12 22C12.5 20 15 18 16 16C22 8 18 4 12 12Z" fill="url(#g1)"/>
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
            <stop stop-color="#d13d71"/>
            <stop offset="1" stop-color="#0f9ddb"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="deco-line-bar right"></div>
    </div>

    <div class="tagline">Effortless meals, at your door</div>

    <div class="separator"></div>

    <div class="headline">
      Redefining Daily<br>
      <span class="gradient-word">Dining.</span>
    </div>

    <div class="cta">Subscribe from ₹160/day</div>
  </div>

  <!-- Bottom trust bar -->
  <div class="bottom-bar">
    <div class="bottom-item">
      <div class="bottom-icon">🍽️</div>
      <div class="bottom-label">200+ Meals Daily</div>
    </div>
    <div class="bottom-item">
      <div class="bottom-icon">🛡️</div>
      <div class="bottom-label">FSSAI Certified</div>
    </div>
    <div class="bottom-item">
      <div class="bottom-icon">⚡</div>
      <div class="bottom-label">98.5% On-Time</div>
    </div>
    <div class="bottom-item">
      <div class="bottom-icon">📱</div>
      <div class="bottom-label">WhatsApp Order</div>
    </div>
  </div>

</body>
</html>
