<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aharam — Fiery Red Non-Veg</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1920px;overflow:hidden;background:#1A0A0A;font-family:'Inter',sans-serif;position:relative}
  .bg-glow{position:absolute;border-radius:50%;filter:blur(150px)}
  .bg-glow.r1{width:600px;height:600px;background:#B71C1C;top:-150px;right:-100px;opacity:.12}
  .bg-glow.r2{width:500px;height:500px;background:#E53935;bottom:300px;left:-150px;opacity:.08}
  .bg-glow.r3{width:400px;height:400px;background:#FF5722;bottom:-80px;right:100px;opacity:.06}
  .embers{position:absolute;inset:0;overflow:hidden}
  .ember{position:absolute;width:4px;height:4px;background:#FF6F00;border-radius:50%;animation:emberRise 6s infinite ease-in;opacity:0}
  .ember:nth-child(1){bottom:0;left:15%;animation-delay:0s}
  .ember:nth-child(2){bottom:0;left:35%;animation-delay:1.5s;width:3px;height:3px}
  .ember:nth-child(3){bottom:0;left:55%;animation-delay:.8s;width:5px;height:5px}
  .ember:nth-child(4){bottom:0;left:72%;animation-delay:2.2s}
  .ember:nth-child(5){bottom:0;left:88%;animation-delay:3s;width:3px;height:3px}
  .ember:nth-child(6){bottom:0;left:25%;animation-delay:4s}
  @keyframes emberRise{0%{transform:translateY(0) scale(1);opacity:0}10%{opacity:.8}100%{transform:translateY(-1900px) scale(0);opacity:0}}
  .content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:120px 60px}
  .fire-badge{background:linear-gradient(135deg,#B71C1C,#E53935);color:#fff;padding:12px 36px;border-radius:50px;font-size:16px;font-weight:700;letter-spacing:3px;text-transform:uppercase;opacity:0;animation:dropIn .8s .3s ease forwards;box-shadow:0 8px 30px rgba(183,28,28,.4)}
  @keyframes dropIn{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:translateY(0)}}
  .brand-name{font-family:'Playfair Display',serif;font-size:120px;font-weight:900;background:linear-gradient(135deg,#FF8A80,#B71C1C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:50px;opacity:0;animation:brandIn 1.2s .8s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes brandIn{from{opacity:0;transform:translateY(50px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
  .tagline{font-size:16px;font-weight:600;color:rgba(255,138,128,.5);letter-spacing:6px;text-transform:uppercase;margin-top:15px;opacity:0;animation:fadeUp 1s 1.6s ease forwards}
  .food-showcase{display:flex;gap:20px;margin-top:70px;flex-wrap:wrap;justify-content:center;max-width:800px}
  .food-card{background:rgba(183,28,28,.08);backdrop-filter:blur(12px);border:1px solid rgba(183,28,28,.2);border-radius:20px;padding:24px 30px;display:flex;align-items:center;gap:16px;opacity:0}
  .food-card:nth-child(1){animation:cardSlide .8s 2s ease forwards}
  .food-card:nth-child(2){animation:cardSlide .8s 2.3s ease forwards}
  .food-card:nth-child(3){animation:cardSlide .8s 2.6s ease forwards}
  .food-card:nth-child(4){animation:cardSlide .8s 2.9s ease forwards}
  @keyframes cardSlide{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
  .food-card .emoji{font-size:42px}
  .food-card .info{display:flex;flex-direction:column}
  .food-card .name{color:#FFCDD2;font-weight:700;font-size:18px}
  .food-card .desc{color:rgba(255,205,210,.4);font-size:13px;margin-top:4px}
  .headline{font-family:'Playfair Display',serif;font-size:64px;font-weight:700;color:#fff;text-align:center;line-height:1.2;margin-top:70px;opacity:0;animation:fadeUp 1s 3.5s ease forwards}
  .headline .fire{background:linear-gradient(135deg,#FF5722,#B71C1C);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  @keyframes fadeUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
  .cta{margin-top:60px;padding:22px 60px;background:linear-gradient(135deg,#B71C1C,#E53935);color:#fff;font-size:18px;font-weight:700;border-radius:12px;letter-spacing:2px;text-transform:uppercase;opacity:0;animation:ctaIn 1s 4.2s ease forwards;box-shadow:0 12px 40px rgba(183,28,28,.3)}
  @keyframes ctaIn{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
  .bottom-brand{position:absolute;bottom:70px;left:0;right:0;text-align:center;z-index:10;opacity:0;animation:fadeIn .8s 5s ease forwards}
  .bottom-brand .brand{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;background:linear-gradient(135deg,#FF8A80,#B71C1C);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .bottom-brand .sub{color:rgba(255,205,210,.25);font-size:12px;margin-top:6px;letter-spacing:3px;text-transform:uppercase}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
  <div class="bg-glow r1"></div><div class="bg-glow r2"></div><div class="bg-glow r3"></div>
  <div class="embers"><div class="ember"></div><div class="ember"></div><div class="ember"></div><div class="ember"></div><div class="ember"></div><div class="ember"></div></div>
  <div class="content">
    <div class="fire-badge">🔥 Non-Veg Specials</div>
    <div class="brand-name">Aharam</div>
    <div class="tagline">Bold • Spicy • Irresistible</div>
    <div class="food-showcase">
      <div class="food-card"><div class="emoji">🍗</div><div class="info"><div class="name">Chicken Curry</div><div class="desc">Rich masala, bone-in</div></div></div>
      <div class="food-card"><div class="emoji">🐟</div><div class="info"><div class="name">Fish Fry</div><div class="desc">Crispy pan-fried</div></div></div>
      <div class="food-card"><div class="emoji">🥚</div><div class="info"><div class="name">Egg Masala</div><div class="desc">Spiced onion base</div></div></div>
      <div class="food-card"><div class="emoji">🍖</div><div class="info"><div class="name">Mutton Biryani</div><div class="desc">Weekend special</div></div></div>
    </div>
    <div class="headline">Non-Veg Meals<br><span class="fire">Delivered Daily.</span></div>
    <div class="cta">Order Non-Veg Now</div>
  </div>
  <div class="bottom-brand"><div class="brand">Aharam</div><div class="sub">Fresh • Hygienic • On Time</div></div>
</body>
</html>
