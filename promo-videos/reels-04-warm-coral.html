<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aharam — Warm Coral</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1920px;overflow:hidden;background:#FFF5F3;font-family:'Inter',sans-serif;position:relative}
  .orb{position:absolute;border-radius:50%;filter:blur(130px)}
  .orb.c1{width:600px;height:600px;background:#FF6F61;top:-150px;left:-100px;opacity:.1;animation:gp 7s infinite ease-in-out}
  .orb.c2{width:500px;height:500px;background:#FF8A80;bottom:200px;right:-200px;opacity:.08;animation:gp 9s 2s infinite ease-in-out}
  .orb.c3{width:400px;height:400px;background:#FFAB91;top:45%;left:60%;opacity:.06;animation:gp 8s 4s infinite ease-in-out}
  @keyframes gp{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
  /* Floating food emojis */
  .floaters{position:absolute;inset:0;overflow:hidden}
  .fl{position:absolute;font-size:40px;opacity:0;animation:flt 15s infinite linear}
  .fl:nth-child(1){left:5%;animation-delay:0s;top:-50px}.fl:nth-child(2){left:25%;animation-delay:3s;top:-50px;font-size:35px}
  .fl:nth-child(3){left:50%;animation-delay:1.5s;top:-50px;font-size:45px}.fl:nth-child(4){left:75%;animation-delay:4.5s;top:-50px}
  .fl:nth-child(5){left:90%;animation-delay:2s;top:-50px;font-size:30px}.fl:nth-child(6){left:15%;animation-delay:5s;top:-50px;font-size:38px}
  .fl:nth-child(7){left:60%;animation-delay:6s;top:-50px}.fl:nth-child(8){left:40%;animation-delay:7s;top:-50px;font-size:42px}
  @keyframes flt{0%{transform:translateY(0) rotate(0deg);opacity:0}5%{opacity:.15}50%{opacity:.1}95%{opacity:.08}100%{transform:translateY(2000px) rotate(360deg);opacity:0}}
  .content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:100px 60px}
  .heart-badge{display:flex;align-items:center;gap:12px;background:rgba(255,111,97,.08);border:1.5px solid rgba(255,111,97,.18);border-radius:60px;padding:14px 36px;opacity:0;animation:sd 1s .3s ease forwards}
  .heart-badge .icon{font-size:24px}
  .heart-badge .text{font-size:15px;font-weight:800;color:#D84315;letter-spacing:4px;text-transform:uppercase}
  @keyframes sd{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:translateY(0)}}
  .brand{font-family:'Playfair Display',serif;font-size:130px;font-weight:900;color:#D84315;margin-top:50px;opacity:0;animation:br 1.5s .8s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes br{from{opacity:0;transform:translateY(60px) scale(.85)}to{opacity:1;transform:translateY(0) scale(1)}}
  .tagline{font-size:17px;font-weight:600;color:rgba(216,67,21,.35);letter-spacing:8px;text-transform:uppercase;margin-top:12px;opacity:0;animation:fu 1s 1.8s ease forwards}
  @keyframes fu{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
  /* Food circle grid */
  .food-ring{width:400px;height:400px;border-radius:50%;position:relative;margin-top:60px;opacity:0;animation:ri 1s 2.2s ease forwards}
  @keyframes ri{from{opacity:0;transform:scale(.5) rotate(-30deg)}to{opacity:1;transform:scale(1) rotate(0)}}
  .food-ring::before{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,111,97,.1)}
  .food-ring::after{content:'';position:absolute;inset:30px;border-radius:50%;border:1.5px dashed rgba(255,111,97,.08)}
  .fd{position:absolute;font-size:52px;animation:pop .5s ease forwards;opacity:0}
  .fd:nth-child(1){top:-10px;left:50%;transform:translateX(-50%);animation-delay:2.6s}
  .fd:nth-child(2){top:25%;right:-10px;animation-delay:2.8s}
  .fd:nth-child(3){bottom:25%;right:-10px;animation-delay:3s}
  .fd:nth-child(4){bottom:-10px;left:50%;transform:translateX(-50%);animation-delay:3.2s}
  .fd:nth-child(5){bottom:25%;left:-10px;animation-delay:3.4s}
  .fd:nth-child(6){top:25%;left:-10px;animation-delay:3.6s}
  .fd-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:70px;opacity:0;animation:pop .6s 3.8s ease forwards}
  @keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
  .headline{font-family:'Playfair Display',serif;font-size:66px;font-weight:700;color:#3E2723;text-align:center;line-height:1.2;margin-top:50px;opacity:0;animation:fu 1.2s 4s ease forwards}
  .headline .coral{color:#FF6F61}
  .sub{font-size:20px;color:rgba(62,39,35,.35);text-align:center;margin-top:20px;line-height:1.5;opacity:0;animation:fu 1s 4.5s ease forwards}
  .cta{margin-top:50px;padding:24px 70px;background:linear-gradient(135deg,#D84315,#FF6F61);color:#fff;font-size:19px;font-weight:800;letter-spacing:3px;text-transform:uppercase;border-radius:60px;box-shadow:0 16px 50px rgba(255,111,97,.25);opacity:0;animation:cp 1s 5s cubic-bezier(.16,1,.3,1) forwards;position:relative;overflow:hidden}
  .cta::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,.15) 50%,transparent 60%);animation:sh 3s 6s infinite}
  @keyframes sh{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  @keyframes cp{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
  .bottom{position:absolute;bottom:70px;left:0;right:0;display:flex;justify-content:center;gap:40px;z-index:10;opacity:0;animation:fu .8s 5.6s ease forwards}
  .bp{background:rgba(255,111,97,.06);border:1px solid rgba(255,111,97,.12);border-radius:50px;padding:10px 22px;font-size:13px;font-weight:600;color:#D84315;display:flex;align-items:center;gap:8px}
</style>
</head>
<body>
  <div class="orb c1"></div><div class="orb c2"></div><div class="orb c3"></div>
  <div class="floaters"><div class="fl">🍛</div><div class="fl">🥗</div><div class="fl">🍚</div><div class="fl">🥘</div><div class="fl">🫓</div><div class="fl">🍲</div><div class="fl">🥕</div><div class="fl">🍅</div></div>
  <div class="content">
    <div class="heart-badge"><span class="icon">❤️</span><span class="text">Made with Love</span></div>
    <div class="brand">Aharam</div>
    <div class="tagline">Homestyle • Everyday</div>
    <div class="food-ring">
      <div class="fd">🍛</div><div class="fd">🥗</div><div class="fd">🍲</div>
      <div class="fd">🫓</div><div class="fd">🥘</div><div class="fd">🍚</div>
      <div class="fd-center">🍽️</div>
    </div>
    <div class="headline">Good Food,<br><span class="coral">Every Day.</span></div>
    <div class="sub">Authentic homestyle meals that taste<br>just like amma's cooking.</div>
    <div class="cta">Start Eating Better</div>
  </div>
  <div class="bottom">
    <div class="bp">🧑‍🍳 Home Chefs</div>
    <div class="bp">⏰ On-Time</div>
    <div class="bp">🛡️ Hygienic</div>
  </div>
</body>
</html>
